[project]
name = "contentbridge-api"
version = "0.1.0"
description = "Gen AI platform for automated content transformation (SIH 2026, PS 26154)"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    # Data
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # Auth
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    # Document processing
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    # RAG
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    # LLM providers
    "google-genai>=0.3",
    "openai>=1.54",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are function calls in defaults by design.
extend-immutable-calls = [
    "fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form",
    "fastapi.Header", "fastapi.Path", "fastapi.Query",
]
