services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contentbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contentbridge}
      POSTGRES_DB: ${POSTGRES_DB:-contentbridge}
    ports:
      - "5544:5432"   # 5433 on the host: avoids colliding with a local postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contentbridge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-contentbridge}:${POSTGRES_PASSWORD:-contentbridge}@postgres:5432/${POSTGRES_DB:-contentbridge}
      QDRANT_URL: http://qdrant:6333
      STORAGE_LOCAL_DIR: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  pgdata:
  qdrant_data:
  storage:
  web_node_modules:
